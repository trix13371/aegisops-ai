name: Local prototype checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aegisops_bootstrap
          POSTGRES_DB: aegisops_test
          POSTGRES_PASSWORD: ci-local-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegisops_bootstrap -d aegisops_test"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      AEGISOPS_BOOTSTRAP_PASSWORD: ci-local-only
      AEGISOPS_DATABASE_URL: postgresql+psycopg://aegisops_app:ci-local-app@127.0.0.1:5432/aegisops_test
      AEGISOPS_MIGRATION_URL: postgresql+psycopg://aegisops_owner:ci-local-owner@127.0.0.1:5432/aegisops_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.1"
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - name: Prepare isolated CI roles
        run: uv run --frozen python scripts/init-ci-db.py
      - run: uv run --frozen alembic upgrade head
      - run: uv run --frozen alembic check
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy
      - run: uv run --frozen lint-imports
      - run: uv run --frozen python scripts/sync-assets.py --check
      - run: uv run --frozen python scripts/prepare-opa-policy.py --check
      - run: uv run --frozen python scripts/export-schemas.py --check
      - name: Verify pinned OPA runtime and Rego policies
        run: |
          curl -fsSL https://github.com/open-policy-agent/opa/releases/download/v1.21.2/opa_linux_amd64_static -o /tmp/aegisops-opa
          echo '830ab11f61ffec760b5e19db0d7ad02bf037e13f5ef4d665faeaf17632177527  /tmp/aegisops-opa' | sha256sum --check
          chmod +x /tmp/aegisops-opa
          /tmp/aegisops-opa check --strict policies/opa
          /tmp/aegisops-opa fmt --fail --list policies/opa
          /tmp/aegisops-opa test policies/opa
      - name: Test with real local OPA and PostgreSQL
        env:
          AEGISOPS_OPA_LIVE: '1'
        run: |
          /tmp/aegisops-opa run --server --addr=127.0.0.1:18181 --authorization=basic --authentication=off --disable-telemetry --log-level=error policies/opa/decision.rego policies/opa/api_authz.rego policies/opa/data.json > /tmp/aegisops-opa.log 2>&1 &
          OPA_PID=$!
          trap 'kill "$OPA_PID"' EXIT
          uv run --frozen python scripts/wait-opa.py
          uv run --frozen pytest --junitxml=.local/pytest.xml
      - name: Persisted offline fixture evaluation
        run: uv run --frozen aegisops eval
      - run: uv run --frozen aegisops doctor
      - run: uv run --frozen pip-audit
      - name: Scan Git history for secrets
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o /tmp/gitleaks-checksums.txt
          cd /tmp
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks-checksums.txt | sha256sum --check
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          /tmp/gitleaks git --redact --no-banner
