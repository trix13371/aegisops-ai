repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --frozen ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format check
        entry: uv run --frozen ruff format --check
        language: system
        types: [python]
      - id: gitleaks
        name: Gitleaks staged secrets
        entry: gitleaks git --staged --redact --no-banner
        language: system
        pass_filenames: false
