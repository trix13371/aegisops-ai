apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegisops-reader
  namespace: aegisops-demo
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aegisops-reader
  namespace: aegisops-demo
rules:
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aegisops-reader
  namespace: aegisops-demo
subjects:
  - kind: ServiceAccount
    name: aegisops-reader
    namespace: aegisops-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aegisops-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aegisops-demo-namespace-marker
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [aegisops-demo]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aegisops-demo-namespace-marker
subjects:
  - kind: ServiceAccount
    name: aegisops-reader
    namespace: aegisops-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aegisops-demo-namespace-marker
