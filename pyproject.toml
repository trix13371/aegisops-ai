[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aegisops-ai"
version = "0.1.0"
description = "Local L0 AegisOps prototype: S0-01 foundation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.10,<3", "typer>=0.15,<1", "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "PyYAML>=6,<7", "kubernetes>=36,<37",
]

[project.scripts]
aegisops = "aegisops.cli.app:app"

[dependency-groups]
dev = [
  "pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1", "mypy>=1.15,<2",
  "import-linter>=2.2,<3", "pip-audit>=2.8,<3", "pre-commit>=4,<5",
  "types-PyYAML>=6,<7", "jsonschema>=4.23,<5", "types-jsonschema>=4,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --tb=short -m 'not llm_live'"
markers = [
  "unit: no external services", "integration: local PostgreSQL or kind",
  "safety: enforcement of prototype boundaries", "contract: stable data contracts",
  "e2e: complete synthetic pipeline", "llm_live: explicit paid provider tests",
  "kind_live: explicitly enabled local Kubernetes tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S", "TID251"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["S603", "S607", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess" = { msg = "Application must not execute commands." }
"os.system" = { msg = "Application must not invoke a shell." }
"pty" = { msg = "Application must not spawn terminals." }

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["kubernetes.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "aegisops"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Application cannot invoke external commands"
type = "forbidden"
source_modules = ["aegisops"]
forbidden_modules = ["subprocess", "pty"]

[[tool.importlinter.contracts]]
name = "Detection and context cannot access services or credentials"
type = "forbidden"
source_modules = ["aegisops.detection", "aegisops.context"]
forbidden_modules = [
  "aegisops.sources", "aegisops.db", "aegisops.config",
  "kubernetes", "socket", "urllib3", "requests", "subprocess", "pty",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aegisops"]

[[tool.importlinter.contracts]]
name = "Model processing cannot reach infrastructure or the HTTP adapter"
type = "forbidden"
source_modules = ["aegisops.llm.engine", "aegisops.llm.fallback", "aegisops.llm.prompt"]
forbidden_modules = [
  "aegisops.sources", "aegisops.db", "aegisops.config", "aegisops.llm.transport",
  "http", "socket", "kubernetes", "subprocess", "pty",
]

[[tool.importlinter.contracts]]
name = "Policy and dry-run cannot access services, models or credentials"
type = "forbidden"
source_modules = ["aegisops.policy", "aegisops.dry_run"]
forbidden_modules = [
  "aegisops.sources", "aegisops.db", "aegisops.config", "aegisops.llm",
  "http", "socket", "kubernetes", "requests", "urllib3", "subprocess", "pty",
]

[[tool.importlinter.contracts]]
name = "Offline evaluation cannot import paid model transport"
type = "forbidden"
source_modules = ["aegisops.evaluation"]
forbidden_modules = ["aegisops.llm.transport"]
