[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aegisops-ai"
version = "0.1.0"
description = "Local L0 AegisOps analysis pipeline and safety foundation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "PyYAML>=6,<7",
  "kubernetes>=36,<37",
  "cryptography>=50,<51",
]

[project.scripts]
aegisops = "aegisops.cli.app:app"
aegisops-collector = "aegisops.collector.cli:main"
aegisops-control = "aegisops.controlplane.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1", "mypy>=1.15,<2",
  "import-linter>=2.2,<3", "pip-audit>=2.8,<3", "pre-commit>=4,<5",
  "types-PyYAML>=6,<7", "jsonschema>=4.23,<5", "types-jsonschema>=4,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --tb=short -m 'not llm_live'"
markers = [
  "unit: no external services", "integration: local PostgreSQL or kind",
  "safety: enforcement of prototype boundaries", "contract: stable data contracts",
  "e2e: complete synthetic pipeline", "llm_live: explicit paid provider tests",
  "kind_live: explicitly enabled local Kubernetes tests",
  "opa_live: explicitly enabled local OPA tests",
  "runner_live: explicitly enabled disposable Docker project checks",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S", "TID251"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["S603", "S607", "TID251"]
"runner/python-v1/entry.py" = ["S603", "S108", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess" = { msg = "Application must not execute commands." }
"os.system" = { msg = "Application must not invoke a shell." }
"pty" = { msg = "Application must not spawn terminals." }

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["kubernetes.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "aegisops"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Signed policy verification has no transport, infrastructure or model access"
type = "forbidden"
source_modules = ["aegisops.domain.policy_release", "aegisops.authorization.releases"]
forbidden_modules = [
  "aegisops.llm", "aegisops.sources", "aegisops.db", "aegisops.config",
  "aegisops.authorization.http", "http", "socket", "subprocess", "kubernetes",
]

[[tool.importlinter.contracts]]
name = "Integrity verifier has no model, network, writer or execution access"
type = "forbidden"
source_modules = ["aegisops.integrity.chain", "aegisops.integrity.models", "aegisops.integrity.repository"]
forbidden_modules = [
  "aegisops.llm", "aegisops.sources", "aegisops.config", "aegisops.db",
  "aegisops.audit", "aegisops.integrity.postgres", "http", "socket", "subprocess",
]

[[tool.importlinter.contracts]]
name = "PEP and projection cannot import transports, models or infrastructure"
type = "forbidden"
source_modules = ["aegisops.authorization.pep", "aegisops.authorization.projection"]
forbidden_modules = [
  "aegisops.authorization.http", "aegisops.llm", "aegisops.sources", "aegisops.db",
  "aegisops.config", "http", "socket", "kubernetes", "requests", "urllib3",
]

[[tool.importlinter.contracts]]
name = "Application cannot invoke external commands"
type = "forbidden"
source_modules = ["aegisops"]
forbidden_modules = ["subprocess", "pty"]

[[tool.importlinter.contracts]]
name = "Local project checks cannot execute code, use services or model credentials"
type = "forbidden"
source_modules = ["aegisops.projects"]
forbidden_modules = [
  "aegisops.collector", "aegisops.sources", "aegisops.llm", "aegisops.config",
  "aegisops.db", "aegisops.authorization", "aegisops.project_ai", "aegisops.project_runner",
  "http", "socket", "subprocess", "kubernetes",
]

